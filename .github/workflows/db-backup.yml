name: Database Backup (PostgreSQL)

on:
  schedule:
    # Executa todos os dias às 06:00 UTC (03:00 Horário de Brasília / BRT)
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      retention_days:
        description: "Dias de retenção para limpeza (opcional, 0 para pular limpeza)"
        required: false
        default: "30"

jobs:
  backup:
    name: Backup PostgreSQL & Upload to S3/R2
    runs-on: ubuntu-latest

    steps:
      - name: Check required secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          MISSING=0
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DATABASE_URL não configurado!"
            MISSING=1
          fi
          if [ -z "$BACKUP_S3_ACCESS_KEY_ID" ] || [ -z "$BACKUP_S3_SECRET_ACCESS_KEY" ]; then
            echo "::error::Credenciais S3/R2 (BACKUP_S3_ACCESS_KEY_ID / BACKUP_S3_SECRET_ACCESS_KEY) não configuradas!"
            MISSING=1
          fi
          if [ -z "$BACKUP_S3_BUCKET" ]; then
            echo "::error::Secret BACKUP_S3_BUCKET não configurado!"
            MISSING=1
          fi
          if [ "$MISSING" -eq 1 ]; then
            exit 1
          fi

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
          pg_dump --version

      - name: Create Database Dump
        id: dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          TIMESTAMP=$(date -u +"%Y%m%d_%H%M%SZ")
          YEAR=$(date -u +"%Y")
          MONTH=$(date -u +"%m")
          BACKUP_NAME="energiv_db_${TIMESTAMP}.dump"

          echo "Iniciando pg_dump para $BACKUP_NAME..."
          # Formato custom (-Fc) inclui compressão interna e permite restore seletivo/paralelo via pg_restore
          pg_dump "$DATABASE_URL" \
            --format=custom \
            --no-owner \
            --no-privileges \
            --verbose \
            --file="$BACKUP_NAME"

          FILE_SIZE=$(du -h "$BACKUP_NAME" | cut -f1)
          SHA256=$(sha256sum "$BACKUP_NAME" | cut -d' ' -f1)
          echo "$SHA256  $BACKUP_NAME" > "${BACKUP_NAME}.sha256"

          echo "backup_name=$BACKUP_NAME" >> "$GITHUB_OUTPUT"
          echo "file_size=$FILE_SIZE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "year=$YEAR" >> "$GITHUB_OUTPUT"
          echo "month=$MONTH" >> "$GITHUB_OUTPUT"
          echo "Backup gerado com sucesso! Tamanho: $FILE_SIZE | SHA256: $SHA256"

      - name: Configure AWS CLI & Upload to S3 / Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.BACKUP_S3_REGION || 'auto' }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_NAME: ${{ steps.dump.outputs.backup_name }}
          YEAR: ${{ steps.dump.outputs.year }}
          MONTH: ${{ steps.dump.outputs.month }}
        run: |
          ENDPOINT_FLAG=""
          if [ -n "$BACKUP_S3_ENDPOINT" ]; then
            ENDPOINT_FLAG="--endpoint-url $BACKUP_S3_ENDPOINT"
          fi

          DEST_PREFIX="backups/postgres/${YEAR}/${MONTH}"
          echo "Enviando $BACKUP_NAME para s3://${BACKUP_S3_BUCKET}/${DEST_PREFIX}/..."

          aws s3 cp "$BACKUP_NAME" \
            "s3://${BACKUP_S3_BUCKET}/${DEST_PREFIX}/${BACKUP_NAME}" \
            $ENDPOINT_FLAG

          aws s3 cp "${BACKUP_NAME}.sha256" \
            "s3://${BACKUP_S3_BUCKET}/${DEST_PREFIX}/${BACKUP_NAME}.sha256" \
            $ENDPOINT_FLAG

          echo "Upload concluído com sucesso."

      - name: Generate Summary Report
        if: always()
        run: |
          echo "### 📦 Relatório de Backup do Banco de Dados" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Arquivo:** \`${{ steps.dump.outputs.backup_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tamanho:** \`${{ steps.dump.outputs.file_size }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA-256:** \`${{ steps.dump.outputs.sha256 }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Destino S3:** \`s3://${{ secrets.BACKUP_S3_BUCKET }}/backups/postgres/${{ steps.dump.outputs.year }}/${{ steps.dump.outputs.month }}/\`" >> $GITHUB_STEP_SUMMARY
