# Railway config — API service.
# Apontar este arquivo no Railway: service api → Settings → "Config File Path"
# = apps/api/railway.toml

[build]
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = "/bin/sh -c \"set -euxo pipefail; cd /app/apps/api; node scripts/migrate-deploy.js\""
startCommand = "node /app/apps/api/dist/main.js"
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
