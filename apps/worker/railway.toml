# Railway config — Worker service (SUSPENSO / DESATIVADO).
# AVISO DE CUSTO: Toda geração de PDF foi centralizada diretamente no serviço da API NestJS (PdfRendererService).
# O serviço 'worker' não precisa mais rodar no Railway e pode ser pausado ou removido no dashboard para corte de custos.
#
# Config File Path no Railway: apps/worker/railway.toml

[build]
dockerfilePath = "apps/worker/Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
